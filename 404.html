<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Not Found — Frameskip Games</title>
    <meta name="robots" content="noindex">

    <link rel="icon" type="image/svg+xml" href="assets/favicon.svg">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500&display=swap">

    <link rel="stylesheet" href="assets/styles.css">

    <script>
        (function () {
            try {
                var saved = localStorage.getItem('frameskip-theme');
                if (saved) document.documentElement.setAttribute('data-theme', saved);
            } catch (e) {}
        })();
    </script>
</head>

<body>
    <main class="notfound">
        <p class="notfound-code">Error 404</p>
        <h1 class="notfound-title">Nothing here.</h1>
        <p class="notfound-body">This page doesn't exist, or it moved somewhere else.</p>
        <a class="btn" href="index.html">Back to home</a>
    </main>

    <script src="assets/site.js"></script>
</body>
</html>
